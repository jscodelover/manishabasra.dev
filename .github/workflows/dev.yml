name: Dev
run-name: Running this action workflow on every branch's commit push except main branch

on:
  push:
    branches-ignore:
      - main

jobs:
  dev:
    name: Dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Dependencies
        run: npm ci

      - name: Check linting
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Check type
        run: npm run typecheck

      - name: Build the package
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Unit Testing
        run: npm run test

      - name: E2e testing
        run: npm run test:e2e
